name: RTL simulation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtl-sim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iverilog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-08-22'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run RTL regression
        run: make sim
      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-simulation-log
          path: build/mac_tb.log
          if-no-files-found: warn
          retention-days: 14
